name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS ARM64 DMG
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and package DMG
        uses: ./.github/actions/build-dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ciaccona-arm64-dmg
          path: |
            build/*.dmg
            build/*.sha256
