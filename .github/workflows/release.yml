name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (leave empty to use v<CFBundleShortVersionString>)
        required: false
        type: string
        default: ""
      prerelease:
        description: Mark as prerelease
        required: false
        type: boolean
        default: false
      draft:
        description: Save as draft release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS ARM64 DMG
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and package DMG
        id: build
        uses: ./.github/actions/build-dmg
        with:
          version: ${{ inputs.tag }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ciaccona-${{ steps.build.outputs.version }}-arm64-dmg
          path: |
            build/*.dmg
            build/*.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          IS_DRAFT: ${{ inputs.draft }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/*.dmg build/*.sha256 --clobber
          else
            ARGS=(release create "$TAG" build/*.dmg build/*.sha256 --target "${{ github.sha }}" --title "$TAG" --generate-notes)
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              ARGS+=(--prerelease)
            fi
            if [[ "$IS_DRAFT" == "true" ]]; then
              ARGS+=(--draft)
            fi
            gh "${ARGS[@]}"
          fi
